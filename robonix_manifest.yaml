manifestVersion: 1
name: robonix-ranger-mini-deploy

# Robonix deploy manifest for the AgileX Ranger Mini + Livox MID-360
# + Intel RealSense D435i stack, runs on the Jetson Orin (syswonder
# desktop, ssh alias `robot`). On the Jetson, the latest robonix
# source tree lives at /home/syswonder/wheatfox/robonix; rbnx is
# expected to be installed via `make install` from that tree.
#
# Each `url:` package is a separate GitHub repo under lhw2002426. `rbnx
# build` clones them into rbnx-boot/cache/<name>/ and runs each
# package's scripts/build.sh; `rbnx boot` then spawns each one and
# calls Driver(CMD_INIT, config_json) on its */driver gRPC interface.
#
# ─── Boot ordering: STRICTLY SERIAL, declaration order ─────────────────
# 自 2026-06 两阶段 bring-up 重构起（docs/soma_two_stage_bringup.md），
# 各段的实际启动方分工是：
#   * builtin（atlas / executor / pilot / liaison / soma / ...）  → rbnx
#   * primitive                                                   → soma stage 1
#   * service                                                     → rbnx
#   * skill（INIT only，ACTIVATE 推迟到 executor 首次调用 MCP）   → soma stage 2
#
# 但**段内顺序**仍然是 STRICTLY SERIAL，依赖声明顺序：
#   * primitive[i] 必须 CMD_INIT ok=true 才会 spawn primitive[i+1]
#     （soma launcher.rs run_stage，stage 内一个一个 bring_up_one）；
#   * service[i] 同理（rbnx deploy.rs）；
#   * skill[i] 同理（soma stage 2 一个一个走 spawn + CMD_INIT）。
# 没有 "deferred" retry —— Driver 返回 ok=false 就 fail 当前 entry，
# soma 把对应 pgid SIGKILL 后继续下一个（不再抛全 boot fatal）。
# rbnx 这边 service 段仍然保持原来的 ok=false → bail。所以：
#   1) put providers BEFORE consumers (lidar before imu-shim that reads
#      /livox/imu; mapping before nav2; etc.);
#   2) packages without a `*/driver` interface skip CMD_INIT entirely
#      and are considered "up" the moment they register a cap on atlas.
# ────────────────────────────────────────────────────────────────────────

env:
  # Override on the launching shell (or via a sourced .env, see
  # .env.example) before `rbnx boot`:
  #   VLM_BASE_URL  for cloud-side reasoning (pilot)
  #   VLM_API_KEY
  #   VLM_MODEL

  # ── scene: run native, no docker ─────────────────────────────────────
  # `system/scene` ships with a docker-default start.sh; we want it to
  # exec native on the Jetson Orin so it joins the same DDS namespace
  # as every other package on this host without an extra container hop.
  # `start.sh` reads ROBONIX_SCENE_FORCE first and ROBONIX_SCENE_PLATFORM
  # second; either alone is sufficient. We set both for clarity.
  #
  # Pre-conditions (run once on the Jetson, BEFORE `rbnx boot`):
  #   bash $ROBONIX_SOURCE_PATH/system/scene/scripts/setup_native.sh
  #   # creates rbnx-build/venv with torch/ultralytics/open_clip/open3d/
  #   # concept-graphs etc., pre-fetches yolov8l-world.pt + mobile_sam.pt
  #   # into docker/_weights/, pre-warms CLIP caches.
  #
  # Then on every boot the venv path is picked up via
  # SCENE_NATIVE_PYTHON below — set explicitly so we don't depend on
  # the operator's interactive shell having activated the venv.
  ROBONIX_SCENE_FORCE: native
  ROBONIX_SCENE_PLATFORM: jetson_orin
  # Path to the venv created by setup_native.sh. Defaults to
  # rbnx-build/venv inside the scene package; the line below makes
  # that absolute so PYTHONPATH inheritance in `rbnx boot` doesn't
  # confuse it. Override on the launching shell if the venv lives
  # elsewhere (e.g. a system-wide /opt/scene-venv/).
  SCENE_NATIVE_PYTHON: ${ROBONIX_SOURCE_PATH}/system/scene/rbnx-build/venv/bin/python
  # Web debug UI port — http://<jetson-ip>:50107 once scene is up.
  # Set to 0 to disable the web UI (registry stays live, only the
  # Starlette/three.js viewer is gated off).
  SCENE_WEB_PORT: "50107"
  # Force CPU on the Jetson dev machines that don't have CUDA wired up.
  # Comment out (or set "") on hosts with working nvidia-smi to use GPU.
  # SCENE_CG_FORCE_CPU: "1"
  # Hugging Face mirror for CN networks — first-run only, after the
  # CLIP cache is pre-warmed by setup_native.sh this is a no-op.
  HF_ENDPOINT: https://hf-mirror.com

system:
  atlas:
    listen: 127.0.0.1:50051
    log: info
  executor:
    listen: 127.0.0.1:50061
    log: info
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison:
    listen: 127.0.0.1:50081
    log: info

  # ── soma ────────────────────────────────────────────────────────────
  # 本体描述 + primitive/skill 编排服务（PR #91 引入，2026-06 两阶段
  # bring-up 重构后正式上线，见 docs/soma_two_stage_bringup.md）。
  #
  # 提供 atlas 上两条 gRPC cap：
  #   robonix/system/soma/get_yaml   — 读 soma.yaml 的 body description
  #   robonix/system/soma/get_urdf   — 读 URDF（XML）
  # 给 pilot/scene/nav2 等消费者用。
  #
  # 设计：       docs/Robonix 开发文档.md §五
  # 两阶段说明： ../docs/soma_two_stage_bringup.md
  # 接入计划：   ../docs/ranger_mini_soma_integration_plan.md
  # 部署 cheatsheet： ./SOMA_DEPLOY.md
  #
  # ─── soma 在 rbnx 启动链中的位置（按当前 robonix 源码核对） ─────────
  # soma 是 rbnx 的 SYSTEM_BUILTIN（和 atlas / executor / pilot /
  # liaison 同列）。rbnx boot 把本段翻译成 CLI flag **直接 fork**
  # `robonix-soma`（spawn_system_binary → Command::new(bin)），而不是
  # 走非 builtin system 包的 `rbnx start -p ... + Driver(CMD_INIT,
  # config_json)` 那条路径。
  # 翻译规则在 deploy.rs 的 `"soma" =>` 分支：支持的 CLI flag 是
  #   --listen / --atlas / --provider-id / --default-robot / --config /
  #   --rbnx-bin / --log / --deployment（数组，每条 path 翻一个 flag）/
  #   --start-packages（2026-06 新增，对应 config.start_packages，默认 true）
  #
  # ─── soma 启动后做的事（两阶段 bring-up，v2 模型） ─────────────────
  # stage 1（soma 进程启动初期）：
  #   1) 解析 `deployments:` 收集所有 primitive + skill 段的包（service
  #      段被显式 skip，由 rbnx 直接起，见 deployment.rs）。
  #   2) 对 primitive 段：spawn `rbnx start -p <pkg> --endpoint <atlas>`
  #      → 等 atlas 注册 → CMD_INIT → CMD_ACTIVATE。
  #   3) 完成后才向 atlas 注册自身的 get_yaml / get_urdf 两个 gRPC cap
  #      并 ACTIVE。
  #   4) 开 `atlas.WatchProvider("soma")` server-stream，挂起等 rbnx
  #      发 stage 2 trigger。
  # stage 2（rbnx 起完 service: 段后发 `NotifyProvider("soma",
  # stage_trigger("stage2"))` 触发）：
  #   1) 对 skill 段：spawn → CMD_INIT，**不** ACTIVATE。
  #   2) skill 留在 INACTIVE，由 executor 在 MCP 工具被首次调用时
  #      （ensure_skill_runnable）再发 CMD_ACTIVATE。
  #
  # 也就是说：**rbnx boot 已经不再起 primitive / skill 段**，那两段
  # 循环 2026-06 已经从 deploy.rs 删除（注释留在原位写
  # "handled by soma's stage 1/2"）。只要本 manifest 里有 primitive
  # 或 skill，就**必须**起 soma；否则机器人不会动。rbnx 内部会在
  # 检测到 primitive/skill 非空但缺 system.soma 时自动注入默认 soma
  # 块（ensure_soma_defaults），所以这里即使整段写得很简，也能跑。
  #
  # 部署机上必须已 `make install` 整套源码（不能单独 cargo install
  # robonix-soma），原因见 SOMA_DEPLOY.md §2.1。
  soma:
    listen: 127.0.0.1:50091
    log: info
    provider_id: soma
    default_robot: ranger_mini_01
    # 把 deployments / robonix_root / start_packages 等放进
    # soma_config.local.yaml 走 --config 加载，便于本地手工
    # `robonix-soma --config <this>` 调试时复用同一份配置。
    # 本部署明确显式开启 start_packages=true（即两阶段 bring-up）。
    #
    # ⚠️ rbnx boot 启动 robonix-soma 时不会强制 chdir，soma 进程会
    # 继承 rbnx boot 的 cwd（一般就是 ranger_mini_deploy/）；
    # --config 参数若写相对路径就按这个 cwd 解析。为防止有人改 boot
    # 起点位置导致解析失败，**坚持用绝对路径**。
    config: /home/syswonder/lhw/ranger_mini_deploy/soma_config.local.yaml

  # Non-builtin system services. rbnx boot resolves these by name to
  # `<robonix_source>/system/<key>/`. The robonix tree currently ships
  # only `memory/`, `scene/`, `speech/` under that path — any other
  # key would be silently warned-and-skipped. Keep the list minimal.
  memory:
    backend: sqlite
    log: info

  # ── scene ────────────────────────────────────────────────────────────
  # Live semantic + geometric map. Owns robonix/system/scene/*.
  #
  # Run mode for this deploy: NATIVE (no docker). The mode switch lives
  # in the top-level `env:` block above (ROBONIX_SCENE_FORCE=native).
  # Before first boot, run the one-shot installer on this Jetson:
  #
  #   bash ${ROBONIX_SOURCE_PATH}/system/scene/scripts/setup_native.sh
  #
  # which materialises rbnx-build/venv with torch + ultralytics +
  # open_clip + open3d + concept-graphs (ali-dev branch), pre-fetches
  # yolov8l-world.pt + mobile_sam.pt into docker/_weights/, and warms
  # the openai-clip + open_clip caches. Idempotent — safe to re-run.
  #
  # Verify scene is up after `rbnx boot`:
  #   1. `rbnx caps -v | grep scene`            — both tools should be ACTIVE.
  #   2. `rbnx tools | grep scene`              — list_objects + goal_near.
  #   3. `curl -fsS http://127.0.0.1:50107/api/state | head -c 200`
  #                                              — web UI responds.
  #   4. `tail -f rbnx-boot/cache/scene/rbnx-build/data/scene.log` to watch
  #      perception ticks; first detection lands within ~5s of camera frames
  #      flowing.
  #
  # On failure the most likely culprit is a missing perception dep —
  # `bash ${ROBONIX_SOURCE_PATH}/system/scene/scripts/start_native.sh`
  # has a fail-loud import probe that lists exactly which Python
  # module is missing and how to install it.
  #
  # observations: omitted — scene's auto-discovery (service.py
  # `_resolve_auto`) walks atlas for the camera RGB/depth + lidar3d +
  # service/map/{pose,occupancy_grid} contracts that the manifest's
  # primitive: + service: blocks below already declare. Override here
  # only if you want to drop a stream (e.g. skip depth on CPU-only
  # hardware) or wire a contract that scene's _SCENE_CONTRACTS table
  # doesn't know about.
  scene:
    log: info

  # Soma (URDF + body description service) shipped via PR #91 — see
  # the system.soma block above and ./SOMA_DEPLOY.md. v0.1 of soma is
  # a passive registry for soma.yaml + URDF text; it does NOT yet
  # spawn robot_state_publisher, so the static_transform_publisher
  # stand-in (`ranger_description` primitive below) is still required
  # to keep /tf_static populated for rtabmap / nav2. When upstream
  # ships the sensor_extrinsics srv and consumers stop relying on tf2
  # for body→sensor edges, drop ranger_description from this manifest.
  #
  # Voice / speech (ASR + TTS + audio_driver) is off for ranger first
  # bring-up — chat is text-only, goes through liaison. Drop a
  # `speech:` block + audio primitives into this manifest later when
  # mics are wired.

primitive:
  # ── Static TF stand-in (until system.soma ships) ────────────────────
  # `ros2 launch` wrapper. start.sh execs ros2 launch directly — no
  # atlas_bridge, no Driver(CMD_INIT) handler, capabilities: [] in the
  # package manifest. rbnx boot registers the cap on atlas the moment
  # start.sh spawns and lets the launch tree run for the lifetime of
  # the deploy (SIGTERM-on-PGID teardown handles cleanup).
  #
  # MUST stay FIRST in this primitive: list — mapping (rtabmap) and
  # nav2 do TF lookups during their own Init, and rbnx boot's
  # strict-serial ordering needs the TFs live before downstream Init
  # runs. ranger_chassis owns odom → base_link, but the static
  # body→sensor edges have no other publisher in the current deploy;
  # without this package, rtabmap's RGBD path silently fails TF
  # lookups and nav goals land 30 cm off.
  #
  # The mount-offset defaults baked into the package's launch file
  # are PLACEHOLDERS derived from CAD. To override per-axis, edit
  # the <arg> defaults in static_tf.launch.xml in the package source
  # (https://github.com/lhw2002426/ranger_description_rbnx) and
  # re-push — there's no manifest-side `launch_args` block on this
  # package because that path required a Python wrapper we deleted
  # for simplicity.
  - name: ranger_description
    url: https://github.com/lhw2002426/ranger_description_rbnx
    branch: main
    # config: {} — package's start.sh ignores config_json (no
    # Driver(CMD_INIT) handler).

  # ── MID-360 lidar ───────────────────────────────────────────────────
  # Owns primitive/lidar/*. Spawns livox_ros_driver2 in Driver.Init.
  # Also makes /livox/imu live on the bus (consumed by mid360_imu below).
  - name: mid360_lidar
    url: https://github.com/lhw2002426/mid360_lidar_rbnx
    branch: main
    config:
      lidar_topic: /scanner/cloud
      lidar_ip: 192.168.1.161
      # host_ip: omit → atlas_bridge auto-resolves via `ip route get`.
      # Override only if the Jetson NIC's static config drifts.
      xfer_format: 2 # PointCloud2 XYZIT (rtabmap-friendly)
      sentinel_timeout_s: 30.0

  # ── MID-360 IMU (topic shim, no ROS spawn) ──────────────────────────
  # Owns primitive/imu/*. Subscribes to /livox/imu (which mid360_lidar's
  # livox launch publishes) and atlas-routes it.
  # MUST stay AFTER mid360_lidar in this list — without /livox/imu live
  # on the DDS graph, this package's Init will block on its sentinel
  # and eventually return ok=false, aborting boot.
  - name: mid360_imu
    url: https://github.com/lhw2002426/mid360_imu_rbnx
    branch: main
    # Driver(CMD_INIT) reads ONLY `imu_topic` + `sentinel_timeout_s`
    # (see mid360_imu/main.py::on_init). Any other key is silently
    # ignored.
    config:
      imu_topic: /livox/imu
      sentinel_timeout_s: 30.0

  # ── RealSense D435i (RGBD) ─────────────────────────────────────────
  # Owns primitive/camera/*. Spawns realsense2_camera's rs_launch.py.
  - name: realsense_camera
    url: https://github.com/lhw2002426/realsense_camera_rbnx
    branch: main
    config:
      camera_name: camera_435i
      rgb_profile: 640x480x30
      depth_profile: 848x480x30
      align_depth: true
      # Published by the RealSense driver on /camera_435i/imu but
      # intentionally NOT atlas-routed (mid360 IMU is canonical).
      # If you later flip this to expose primitive/imu/* from
      # realsense, drop mid360_imu OR pick a non-conflicting cap_id —
      # atlas allows multiple providers for the same contract but
      # the LLM tool list will collapse them and you'll get
      # nondeterministic routing.
      enable_imu: false
      enable_sync: true
      sentinel_timeout_s: 30.0

  # ── Ranger Mini chassis ─────────────────────────────────────────────
  # Owns primitive/chassis/*. Publishes /odom (consumed by mapping below).
  # MUST stay enabled together with mapping.sensors.odom: true (see
  # service.mapping below) — flipping one without the other yields
  # silently-degraded SLAM.
  - name: ranger_chassis
    url: https://github.com/lhw2002426/ranger_chassis_rbnx
    branch: main
    config:
      port_name: can_ranger
      robot_model: ranger_mini_v2
      odom_topic_name: odom
      publish_odom_tf: true # soma not yet shipped — chassis owns /tf for now
      sentinel_timeout_s: 30.0

service:
  # ── SLAM (rtabmap) ──────────────────────────────────────────────────
  # Discovers lidar3d + rgb + depth via atlas at Init time and
  # configures rtabmap to fuse them. Outputs service/map/{occupancy_grid,
  # pointcloud, pose, odom} on atlas — algo-agnostic for consumers.
  - name: mapping
    url: https://github.com/lhw2002426/mapping_rbnx
    branch: main
    config:
      algo: rtabmap
      platform: jetson_orin
      sensors:
        lidar2d: false
        lidar3d: true # MID-360 PointCloud2
        rgb: true # RealSense visual loop closure
        rgbd: true # RealSense depth → 3D fusion
        # rtabmap launch in mapping_rbnx doesn't currently wire IMU
        # (the comment in launch/rtabmap_2d.launch.py promises it but
        # the code isn't there). Leave OFF — MID-360 lidar alone is
        # usually enough for graph SLAM. Flip to true once mapping_rbnx
        # grows imu_topic + subscribe_imu wiring.
        imu: false
        # Chassis IS enabled in primitive: above (publishes /odom),
        # so let rtabmap fuse it. If you ever disable ranger_chassis,
        # flip this to false too — otherwise rtabmap's Init will
        # block waiting for /odom and fail.
        odom: true
      # mapping_rbnx defaults use_sim_time to "true" in its resolved
      # YAML (src/mapping_rbnx/atlas_bridge.py:288). On real hardware
      # that makes rtabmap block waiting for /clock. Override here.
      use_sim_time: false
      base_frame: base_link
      odom_frame: odom
      # Fresh mapping mode: do not set map_database_path here. If a prebuilt
      # RTAB-Map database is needed later, set map_database_path explicitly
      # and choose map_mode: mapping|localization.
      map_mode: mapping

  # ── Navigation ──────────────────────────────────────────────────────
  # nav2_wrapper_rbnx wraps upstream `nav2_bringup` (installed via apt:
  # ros-humble-nav2-bringup; the wrapper itself vendors only the params
  # YAMLs under config/). Owns robonix/service/navigation/*.
  #
  # MUST come AFTER `mapping` — on Init the wrapper queries atlas for
  # robonix/service/map/occupancy_grid (REQUIRED — fails Init if
  # missing) and robonix/primitive/chassis/odom (REQUIRED), plus
  # optionally robonix/primitive/lidar/{lidar,lidar3d}. rbnx has no
  # defer/retry; if mapping hasn't declared yet, nav2 Init returns
  # ok=false and boot bails.
  #
  # Full config reference lives in the upstream package_manifest.yaml
  # header and its README.md §"Config (passed via Driver(CMD_INIT)".
  # Every field has a default; the values below are explicit so the
  # deploy documents its intent instead of relying on upstream defaults
  # that may drift.
  - name: nav2
    url: https://github.com/lhw2002426/nav2_wrapper_rbnx
    branch: main
    config:
      # Picks config/nav2_params_slam.yml (vendored in the wrapper).
      # Other profiles: "sim" | "default". Override entirely by setting
      # `params_file` to an absolute path or path relative to the
      # package root.
      params_profile: slam
      use_sim_time: false
      # How long to wait for nav2's `navigate_to_pose` action server
      # to come up after the lifecycle bringup. Jetson Orin with full
      # nav2 stack is usually 20–30s cold, 45s gives slack for swap /
      # concurrent SLAM warm-up. Init returns state="degraded" (not
      # ok=false) if this trips — boot continues.
      action_wait_s: 45.0
      # Per-key override of atlas-resolved bindings. Leave empty to let
      # the wrapper pick whatever atlas reports (the common case). Keys:
      #   map, odom          — required
      #   scan, scan_cloud   — optional
      topic_remap: {}

skill:
  # explore_rbnx — autonomous frontier exploration. After boot it
  # registers but stays in INACTIVE; executor sends Driver(CMD_ACTIVATE)
  # the first time the LLM picks one of its tools (sticky lazy-activate,
  # see executor::dispatch::ensure_skill_runnable).
  #
  # Driver(CMD_INIT) accepts cfg for forward-compat but ignores it —
  # there are NO manifest-level knobs today (explore_skill/atlas_bridge.py
  # `@cap.on_init` just logs and returns Ok). Per-invocation params
  # (area_hint / timeout_s / max_speed_m_s) are arguments to the MCP
  # tool `robonix/skill/explore/explore`, not to this manifest entry.
  # Leaving `config: {}` here instead of invented keys avoids confusing
  # the next operator into thinking they can tune explore from here.
  - name: explore
    url: https://github.com/lhw2002426/explore_rbnx
    branch: main
    config: {}

  # soma_bridge_rbnx — temporary gRPC→MCP transport adapter for Soma.
  #
  # ─── 为什么还需要这个 bridge（按当前源码核对） ────────────────────
  # robonix-soma 启动后会自己向 atlas 注册两条 cap（main.rs:67-98）：
  #   robonix/system/soma/get_yaml  (Transport::Grpc, field: yaml_text)
  #   robonix/system/soma/get_urdf  (Transport::Grpc, field: urdf_xml)
  # 但 pilot 的 LLM 工具发现循环
  # （system/pilot/src/discovery.rs:74-90, `discover()`）写死了
  # `query_capabilities("", "", Transport::Mcp)`，对 `cap.transport
  # != Mcp` 的项直接 `continue` 丢掉。也就是说：
  #   * soma 在 atlas 上是可见的，`rbnx caps | grep soma` 能看到。
  #   * pilot 的 LLM 看不到，无法生成调 soma 的工具调用。
  #
  # 本 skill 是一个轻量转发器：用 fastmcp 启一个 MCP server，把
  #   robonix/skill/soma_bridge/get_yaml   (Transport::Mcp)
  #   robonix/skill/soma_bridge/get_urdf   (Transport::Mcp)
  # 注册到 atlas；每个 MCP handler 内部以 gRPC 客户端身份调
  # robonix-soma 的同名 RPC，把字段原样回传。pilot 的发现循环
  # 这下能看见，LLM 就能问 "你的 description 段告诉我"。
  #
  # ─── 什么时候可以删 ─────────────────────────────────────────────
  # 上游 pilot 任一种修复落地就可以删：
  #   (a) discovery.rs 改成读所有 transport（或专门加 grpc 分支），
  #       自带 grpc→llm-tool 适配；或
  #   (b) pilot 直接把 soma.yaml 渲进 system prompt（计划里说过的方案）。
  # 任意一种 PR 合并后，把本段从 manifest 删掉即可，bridge 自身无状态。
  #
  # ─── 依赖与启动顺序 ────────────────────────────────────────────
  # 需要 system.soma 已 ACTIVE 才能完成 CMD_ACTIVATE（首次 MCP 调用时
  # 触发，resolve soma 的两个 gRPC endpoint 并打开 long-lived channel）。
  # rbnx boot 顺序：atlas → executor → pilot → liaison → soma → 非
  # builtin system → primitive → service → skill(lazy)，等 pilot 触发
  # 本 skill 的 CMD_ACTIVATE 时 soma 早已就绪。
  #
