# Optional robonix-soma config for manual debugging.
# Normal `rbnx boot` reads the Soma deployment settings from
# robonix_manifest.yaml: system.soma, not from this file.

atlas_endpoint: 127.0.0.1:50051
listen: 127.0.0.1:50091
provider_id: soma
default_robot: ranger_mini_01

robonix_root: /home/syswonder/lhw/ranger_mini_deploy
deployments:
  - /home/syswonder/lhw/ranger_mini_deploy

start_packages: true
rbnx_bin: rbnx
